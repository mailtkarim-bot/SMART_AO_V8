name: smart-ao-preprod

services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    init: true
    environment:
      SMART_AO_PUBLIC_HOST: ${SMART_AO_PUBLIC_HOST:?SMART_AO_PUBLIC_HOST is required}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_started
    networks:
      - edge
      - internal
    security_opt:
      - no-new-privileges:true

  frontend:
    build:
      context: ..
      dockerfile: ops/docker/frontend.Dockerfile
    restart: unless-stopped
    init: true
    expose:
      - "80"
    networks:
      - edge
      - internal
    security_opt:
      - no-new-privileges:true

  backend:
    build:
      context: ..
      dockerfile: ops/docker/backend.Dockerfile
    restart: unless-stopped
    init: true
    env_file:
      - .env.preprod
    environment:
      SMART_AO_ENV: preproduction
      SMART_AO_DCE_QUARANTINE_ROOT: /var/lib/smart_ao/dce-quarantine
      SMART_AO_CLAMD_HOST: clamav
      SMART_AO_CLAMD_PORT: "3310"
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      clamav:
        condition: service_healthy
    volumes:
      - dce_quarantine:/var/lib/smart_ao/dce-quarantine
    networks:
      - internal
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import socket; s=socket.create_connection(('127.0.0.1',8000),2); s.close()"
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    security_opt:
      - no-new-privileges:true

  dce-retention-worker:
    build:
      context: ..
      dockerfile: ops/docker/backend.Dockerfile
    command: python -m app.workers.dce_retention
    restart: unless-stopped
    init: true
    env_file:
      - .env.preprod
    environment:
      SMART_AO_ENV: preproduction
      SMART_AO_DCE_QUARANTINE_ROOT: /var/lib/smart_ao/dce-quarantine
      SMART_AO_RETENTION_BATCH_SIZE: ${SMART_AO_RETENTION_BATCH_SIZE:-50}
      SMART_AO_RETENTION_LEASE_SECONDS: ${SMART_AO_RETENTION_LEASE_SECONDS:-120}
      SMART_AO_RETENTION_POLL_SECONDS: ${SMART_AO_RETENTION_POLL_SECONDS:-30}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - dce_quarantine:/var/lib/smart_ao/dce-quarantine
    networks:
      - internal
    security_opt:
      - no-new-privileges:true

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    init: true
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 20
    security_opt:
      - no-new-privileges:true

  clamav:
    image: clamav/clamav:1.4_base
    restart: unless-stopped
    init: true
    environment:
      CLAMAV_NO_MILTERD: "true"
    volumes:
      - clamav_database:/var/lib/clamav
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping 1"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 90s
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
  dce_quarantine:
  clamav_database:
  caddy_data:
  caddy_config:

networks:
  edge:
    driver: bridge
  internal:
    driver: bridge
    internal: true
