<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>SMART_AO V8 — Couverture & Gate VPS</title>
  <style>
    * { box-sizing: border-box; }
    html,body { height:100%; margin:0; }
    .slide-container {
      width: 1280px;
      min-height: 720px;
      background: #e0e0e0;
      color: #111111;
      font-family: "Helvetica Neue", Arial, sans-serif;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .frame {
      width: 1040px;
      min-height: 500px;
      border: 4px solid #111111;
      /* reduced vertical padding to save height */
      padding: 44px 64px 36px 64px;
      position: relative;
      background: #e0e0e0;
    }
    .kicker {
      color: #0055ff;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 20px; /* tightened spacing */
    }
    h1 {
      font-family: "Arial Black", Impact, sans-serif;
      font-size: 70px;
      line-height: 0.98;
      letter-spacing: -2px;
      text-transform: uppercase;
      margin: 0 0 20px 0; /* tightened spacing */
      max-width: 820px;
    }
    .subtitle {
      font-family: Georgia, serif;
      font-size: 29px;
      line-height: 1.35;
      max-width: 800px;
      margin: 0 0 30px 0; /* tightened spacing */
    }
    .meta {
      display: flex;
      gap: 34px; /* tightened spacing */
      font-family: Georgia, serif;
      font-size: 20px;
      color: #0055ff;
    }
    .accent {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      min-height: 12px; /* reduced to save space */
      background: #0055ff;
    }
    .stamp {
      position: absolute;
      right: 42px;
      top: 48px;
      border: 2px solid #0055ff;
      color: #0055ff;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 1px;
      padding: 8px 12px; /* slightly reduced */
      transform: rotate(4deg);
    }
  </style>
</head>
<body>
  <div class="slide-container">
    <div class="frame">
      <div class="kicker">Plan de durcissement & préproduction</div>
      <h1>SMART_AO V8<br>Couverture<br>&amp; Gate VPS</h1>
      <p class="subtitle">Remonter les angles morts patronaux, protéger les invariants métier et préparer une validation VPS réellement démontrée.</p>
      <div class="meta">
        <span>Août 2026</span>
        <span>ops/vps-deploy-health-digests-01</span>
      </div>
      <div class="stamp">PRÉPARÉ — NON ENCORE EXÉCUTÉ SUR VPS RÉEL</div>
    </div>
    <div class="accent"></div>
  </div>
</body>
</html>
