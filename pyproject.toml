[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-ao-v8"
version = "0.1.0"
description = "SMART_AO V8 — SaaS BTP d'analyse DCE et gestion d'appels d'offres"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1.0",
  "pydantic>=2.10,<3.0",
  "pydantic-settings>=2.6,<3.0",
  "sqlalchemy>=2.0,<3.0",
  "alembic>=1.14,<2.0",
  "psycopg[binary]>=3.2,<4.0",
  "uvicorn[standard]>=0.34,<1.0",
  "argon2-cffi>=23.1,<26.0",
  "pyjwt>=2.10,<3.0",
  "python-magic>=0.4.27,<1.0",
  "pypdf>=6.16.0",
  "python-docx>=1.2.0",
  "openpyxl>=3.1.5",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1.0",
  "pytest>=8.3,<9.0",
  "pytest-cov>=6.0,<7.0",
  "ruff>=0.9,<1.0",
  "bandit>=1.8,<2.0",
  "detect-secrets>=1.5,<2.0",
  "pip-audit>=2.9,<3.0",
]

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
pythonpath = ["backend"]
testpaths = ["backend/tests"]
markers = [
  "schema: validation Pydantic sans dépendance externe",
  "domain: règles pures et invariants",
  "application: handlers, auth, idempotence et résultats",
  "integration: scénario métier traversant plusieurs roots et adaptateurs",
  "db: PostgreSQL, contraintes et migrations",
  "api: contrats FastAPI",
  "architecture: frontières, imports et ORM",
  "concurrency: deux sessions et retries",
  "security: tenant isolation et confidentialité",
  "process: Process Managers, outbox et déduplication",
]

[tool.coverage.run]
branch = true
source = ["backend/app"]
