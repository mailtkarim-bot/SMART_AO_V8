<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; }
        .slide-container {
            width: 1280px;
            min-height: 720px;
            background-color: #E2E8F0;
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            grid-template-rows: 1fr auto 1fr;
            padding: 52px; /* reduced from 80px to 52px to lower overall height (774 -> 718px) */
        }
        .title-block {
            grid-column: 1 / 10;
            grid-row: 2;
            background-color: #DD6B20;
            padding: 40px; /* keep upper padding of title intact */
            margin-bottom: 40px;
        }
        h1 {
            color: #000000;
            font-weight: 800;
            font-size: 84px;
            letter-spacing: -0.04em;
            line-height: 1.1;
            text-align: left;
        }
        .subtitle-block {
            grid-column: 1 / 10;
            grid-row: 3;
            padding-left: 40px;
        }
        h2 {
            color: #1A202C;
            font-weight: 800;
            font-size: 42px;
            letter-spacing: -0.02em;
            line-height: 1.2;
            margin-bottom: 20px;
        }
        p {
            color: #1A202C;
            font-weight: 500;
            font-size: 24px;
            line-height: 1.4;
        }
        .decorative-line {
            grid-column: 1 / 13;
            grid-row: 1;
            border-top: 8px solid #000000;
            align-self: start;
        }
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="decorative-line"></div>
        <div class="title-block">
            <h1>DCE-REQUIREMENTS-01</h1>
        </div>
        <div class="subtitle-block">
            <h2>Exigences atomiques sourcées du règlement de consultation</h2>
            <p>Architecture actuelle, garanties et limites de livraison</p>
        </div>
    </div>
</body>
</html>
