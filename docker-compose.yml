# Local development compose only. Preproduction requires explicit JWT secrets
# through ops/docker-compose.preprod.yml and must not inherit these defaults.
services:
  postgres:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smart_ao}
      POSTGRES_USER: ${POSTGRES_USER:-smart_ao}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smart_ao}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smart_ao} -d ${POSTGRES_DB:-smart_ao}"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    security_opt:
      - no-new-privileges:true

  migrate:
    build:
      context: .
      dockerfile: ops/docker/backend.Dockerfile
    command: ["alembic", "-c", "/app/alembic.ini", "upgrade", "head"]
    restart: "no"
    environment:
      SMART_AO_ENV: development
      SMART_AO_DATABASE_URL: ${SMART_AO_DATABASE_URL:-postgresql+psycopg://smart_ao:smart_ao@postgres:5432/smart_ao}
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

  backend:
    build:
      context: .
      dockerfile: ops/docker/backend.Dockerfile
    environment:
      SMART_AO_ENV: development
      SMART_AO_LOG_LEVEL: ${SMART_AO_LOG_LEVEL:-INFO}
      SMART_AO_DATABASE_URL: ${SMART_AO_DATABASE_URL:-postgresql+psycopg://smart_ao:smart_ao@postgres:5432/smart_ao}
      SMART_AO_JWT_SIGNING_KEY: ${SMART_AO_JWT_SIGNING_KEY:-dev-only-signing-key-change-me-0123456789}
      SMART_AO_JWT_ISSUER: ${SMART_AO_JWT_ISSUER:-smart-ao-dev}
      SMART_AO_JWT_AUDIENCE: ${SMART_AO_JWT_AUDIENCE:-smart-ao-dev}
      SMART_AO_DCE_QUARANTINE_ROOT: /var/lib/smart_ao/dce-quarantine
      SMART_AO_CLAMD_HOST: clamav
      SMART_AO_CLAMD_PORT: "3310"
      SMART_AO_CLAMD_TIMEOUT_SECONDS: "30"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      clamav:
        condition: service_healthy
    volumes:
      - dce_quarantine:/var/lib/smart_ao/dce-quarantine
    ports:
      - "127.0.0.1:8000:8000"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz/ready', timeout=3).read()"
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  dce-retention-worker:
    build:
      context: .
      dockerfile: ops/docker/backend.Dockerfile
    command: python -m app.workers.dce_retention
    restart: unless-stopped
    environment:
      SMART_AO_DATABASE_URL: ${SMART_AO_DATABASE_URL:-postgresql+psycopg://smart_ao:smart_ao@postgres:5432/smart_ao}
      SMART_AO_DCE_QUARANTINE_ROOT: /var/lib/smart_ao/dce-quarantine
      SMART_AO_RETENTION_BATCH_SIZE: "50"
      SMART_AO_RETENTION_LEASE_SECONDS: "120"
      SMART_AO_RETENTION_POLL_SECONDS: "30"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - dce_quarantine:/var/lib/smart_ao/dce-quarantine
    security_opt:
      - no-new-privileges:true

  clamav:
    image: clamav/clamav:1.4_base@sha256:1b6920e8c32cca47ea33b1e2611d9a4740ccc622cf13b30b29f8283d60175e39
    environment:
      CLAMAV_NO_MILTERD: "true"
    volumes:
      - clamav_database:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping 1"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 90s
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
  dce_quarantine:
  clamav_database:
