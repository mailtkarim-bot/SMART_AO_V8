name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: smart_ao
          POSTGRES_USER: smart_ao
          POSTGRES_PASSWORD: smart_ao
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smart_ao -d smart_ao"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --group dev
      - name: Lint
        run: uv run ruff check .
      - name: Secrets scan
        run: >-
          git ls-files -z | xargs -0
          uv run detect-secrets-hook --baseline .secrets.baseline
          --exclude-files '^docs/|^web/pnpm-lock.yaml$'
      - name: Dependency vulnerability audit
        run: >-
          uv export --no-emit-project --no-dev --format requirements-txt
          -o /tmp/smart_ao_requirements.txt
          && uv run pip-audit --strict -r /tmp/smart_ao_requirements.txt
      - name: Python SAST
        run: uv run bandit -q -r backend/app -ll
      - name: Tests and coverage gate
        run: >-
          uv run pytest backend/tests -q --cov=app --cov-report=term-missing
          --cov-report=json:ci-coverage/coverage.json
          --cov-report=xml:ci-coverage/coverage.xml --cov-fail-under=85.50
      - name: Collect coverage environment
        if: always()
        run: uv run python scripts/collect_coverage_diagnostics.py
          --output-dir ci-coverage --environment-only
      - name: Upload coverage diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.sha }}
          path: ci-coverage/
          if-no-files-found: error

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Test cockpit
        working-directory: web
        run: pnpm test
      - name: Build cockpit
        working-directory: web
        run: pnpm build
      - name: Frontend dependency audit
        working-directory: web
        run: pnpm audit --prod --audit-level high

  image-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify deployment Dockerfile
        run: test -f ops/docker/backend.Dockerfile
      - name: Build deployment image
        run: docker build --file ops/docker/backend.Dockerfile --tag smart-ao-v8:ci .
      - name: Scan deployment image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: smart-ao-v8:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH
