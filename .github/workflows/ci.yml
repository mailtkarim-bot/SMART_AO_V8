name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: smart_ao
          POSTGRES_USER: smart_ao
          POSTGRES_PASSWORD: smart_ao
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smart_ao -d smart_ao"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --group dev
      - name: Lint
        run: uv run ruff check .
      - name: Secrets scan
        run: >-
          git ls-files -z | xargs -0
          uv run detect-secrets-hook --baseline .secrets.baseline
      - name: Dependency vulnerability audit
        run: >-
          uv export --no-emit-project --no-dev --format requirements-txt
          -o /tmp/smart_ao_requirements.txt
          && uv run pip-audit --strict -r /tmp/smart_ao_requirements.txt
      - name: Python SAST
        run: uv run bandit -q -r backend/app -ll
      - name: Smoke tests
        run: uv run pytest backend/tests -q

  image-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect deployment Dockerfile
        id: dockerfile
        run: |
          if [ -f Dockerfile ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No Dockerfile currently exists; image build and scan are not applicable."
          fi
      - name: Build deployment image
        if: steps.dockerfile.outputs.present == 'true'
        run: docker build --tag smart-ao-v8:ci .
      - name: Scan deployment image
        if: steps.dockerfile.outputs.present == 'true'
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: smart-ao-v8:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH
