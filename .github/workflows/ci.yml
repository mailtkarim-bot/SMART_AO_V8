name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: smart_ao
          POSTGRES_USER: smart_ao
          POSTGRES_PASSWORD: smart_ao
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smart_ao -d smart_ao"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --group dev
      - name: Lint
        run: uv run ruff check .
      - name: Smoke tests
        run: uv run pytest backend/tests -q
